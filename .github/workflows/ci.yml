name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.20"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint CLI and tests
        run: uv run --locked ruff check src tests

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Install browser for offline UI tests
        run: uv run --locked playwright install --with-deps --only-shell chromium

      - name: Run offline tests
        run: uv run --locked pytest -m "not live and not network"

      - name: Build source distribution and wheel
        run: uv build

      - name: Smoke-test installed wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl havoc365 --help
          uv run --isolated --no-project --with dist/*.whl python - <<'PY'
          from importlib.resources import files
          for name in ("index.html", "app.js", "style.css"):
              assert files("havoc365").joinpath("web", name).is_file(), name
          PY
